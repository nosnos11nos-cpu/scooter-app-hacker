name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04 # Стабильная версия Ubuntu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # КРИТИЧЕСКИ ВАЖНО: именно 3.10

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          # КРИТИЧЕСКИ ВАЖНО: Cython должен быть 0.29.33, а не 3.x
          pip install --user --upgrade buildozer "cython==0.29.33" virtualenv

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Очищаем кеш перед сборкой, чтобы не тянуть старые ошибки
          buildozer android clean
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScooterTool-APK
          path: bin/*.apk
